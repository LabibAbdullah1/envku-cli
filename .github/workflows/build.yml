name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Cross-Compile Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/envku-linux-amd64 ./cmd/envku

      - name: Build Linux arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/envku-linux-arm64 ./cmd/envku

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envku-binaries
          path: dist/*
